[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "GridClear"
description = "Adds a Clear Grid button to the gear upgrade menu that unequips all upgrades from the hex grid in one click."
websiteUrl = "https://github.com/Little-Sparroh/GridClear"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"
Sparroh-SparrohUILib = "1.0.0"


[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/net48/GridClear.dll"
target = "BepInEx/plugins/GridClear.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "client" ]
